<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stopper Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4">Stopper Dashboard</h1>
    <a href="{{ url_for('add_habit') }}" class="btn btn-primary mb-3">Add New Habit</a>
    {% if habits %}
        <ul class="list-group">
        {% for habit in habits %}
            <li class="list-group-item">
                <strong>{{ habit.name }}</strong> ({{ habit.type }})<br>
                Started: {{ habit.start_date }}<br>
                Target: {{ habit.target }}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No habits yet. <a href="{{ url_for('add_habit') }}">Add your first habit</a>!</p>
    {% endif %}
</div>
</body>
</html>
