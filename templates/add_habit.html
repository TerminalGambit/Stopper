<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Habit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-xl mx-auto py-10">
    <h1 class="text-3xl font-bold mb-6 text-center text-blue-700">Add a New Habit</h1>
    <form method="post" class="bg-white p-8 rounded-lg shadow space-y-6">
        <div>
            <label for="name" class="block text-gray-700 font-semibold mb-1">Habit Name</label>
            <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" id="name" name="name" required>
        </div>
        <div>
            <label for="type" class="block text-gray-700 font-semibold mb-1">Type</label>
            <select class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" id="type" name="type" required>
                <option value="quit">Quit-based</option>
                <option value="consistency">Consistency-based</option>
            </select>
        </div>
        <div>
            <label for="target" class="block text-gray-700 font-semibold mb-1">Target <span class="text-gray-400 text-xs">(e.g., 5x/week or 0 triggers)</span></label>
            <input type="text" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" id="target" name="target" required>
        </div>
        <div>
            <label for="start_date" class="block text-gray-700 font-semibold mb-1">Start Date</label>
            <input type="date" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" id="start_date" name="start_date" required>
        </div>
        <div>
            <label for="notes" class="block text-gray-700 font-semibold mb-1">Notes <span class="text-gray-400 text-xs">(optional)</span></label>
            <textarea class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" id="notes" name="notes"></textarea>
        </div>
        <div class="flex justify-between">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded shadow">Add Habit</button>
            <a href="{{ url_for('dashboard') }}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-6 rounded shadow">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
