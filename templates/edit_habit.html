<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Habit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-xl mx-auto py-10">
    <a href="/" class="text-blue-600 hover:underline">&larr; Back to Dashboard</a>
    <h1 class="text-3xl font-bold mb-6 text-center text-indigo-700">Edit Habit</h1>
    <form method="post" class="bg-white p-8 rounded-lg shadow space-y-6">
        <div>
            <label for="name" class="block text-gray-700 font-semibold mb-1">Habit Name</label>
            <input type="text" class="w-full border border-gray-300 rounded px-3 py-2" id="name" name="name" value="{{ habit.name }}" required>
        </div>
        <div>
            <label for="type" class="block text-gray-700 font-semibold mb-1">Type</label>
            <select class="w-full border border-gray-300 rounded px-3 py-2" id="type" name="type" required>
                <option value="quit" {% if habit.type == 'quit' %}selected{% endif %}>Quit-based</option>
                <option value="consistency" {% if habit.type == 'consistency' %}selected{% endif %}>Consistency-based</option>
            </select>
        </div>
        <div>
            <label for="target" class="block text-gray-700 font-semibold mb-1">Target</label>
            <input type="text" class="w-full border border-gray-300 rounded px-3 py-2" id="target" name="target" value="{{ habit.target }}" required>
        </div>
        <div>
            <label for="start_date" class="block text-gray-700 font-semibold mb-1">Start Date</label>
            <input type="date" class="w-full border border-gray-300 rounded px-3 py-2" id="start_date" name="start_date" value="{{ habit.start_date }}" required>
        </div>
        <div>
            <label for="notes" class="block text-gray-700 font-semibold mb-1">Notes</label>
            <textarea class="w-full border border-gray-300 rounded px-3 py-2" id="notes" name="notes">{{ habit.notes }}</textarea>
        </div>
        <div>
            <label for="tags" class="block text-gray-700 font-semibold mb-1">Tags <span class="text-gray-400 text-xs">(comma separated)</span></label>
            <input type="text" class="w-full border border-gray-300 rounded px-3 py-2" id="tags" name="tags" value="{{ habit.tags|join(', ') if habit.tags else '' }}">
        </div>
        <div>
            <label for="milestones" class="block text-gray-700 font-semibold mb-1">Custom Milestones <span class="text-gray-400 text-xs">(comma separated, e.g. 5,10,21)</span></label>
            <input type="text" class="w-full border border-gray-300 rounded px-3 py-2" id="milestones" name="milestones" value="{{ habit.custom_milestones|join(', ') if habit.custom_milestones else '' }}">
        </div>
        <div class="flex justify-between">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded shadow">Save</button>
            <a href="/" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-6 rounded shadow">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
