<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Digest</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div class="max-w-2xl mx-auto py-10">
    <a href="/" class="text-blue-600 hover:underline">&larr; Back to Dashboard</a>
    <h1 class="text-3xl font-bold mb-6 text-center text-purple-700">Weekly Digest</h1>
    <div class="space-y-6">
    {% for habit in summary %}
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xl font-semibold text-gray-800">{{ habit.name }}</span>
                <span class="px-2 py-1 rounded text-xs font-bold {{ 'bg-green-100 text-green-700' if habit.type == 'consistency' else 'bg-red-100 text-red-700' }}">{{ habit.type|capitalize }}</span>
            </div>
            <div class="text-gray-700 mb-1">Completed: <span class="font-bold">{{ habit.done }}</span> | Failed: <span class="font-bold text-red-500">{{ habit.failed }}</span></div>
            <div class="text-gray-500 text-xs">Streaks: {% if habit.streaks %}{{ habit.streaks|join(', ') }}{% else %}None{% endif %}</div>
        </div>
    {% endfor %}
    </div>
</div>
</body>
</html>
